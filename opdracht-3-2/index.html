<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

 <form action="index.html" method="post">
  <label for="naam">Naam:</label> <br>
  <input type="text" id="naam" pattern="[A-Za-z]*" required> <br> <br>

  <label for="achternaam">Achternaam:</label> <br> 
  <input type="text"  id="achternaam" pattern="[A-za-z]*" required> <br> <br>


  <legend>Kies uw geslacht:</legend>

<div class="container">
  <div>
    <input type="radio" id="Dhr." name="geslacht" value="geslacht" checked />
    <label for="Dhr.">Dhr.</label>
  </div>
  <div>
    <input type="radio" id="Mvr." name="geslacht" value="Mvr." />
    <label for="Mvr.">Mvr.</label>
  </div>
  <div>
    <input type="radio" id="Anders." name="geslacht" value="Anders." />
    <label for="Anders.">Anders.</label>
  </div>
</div   ><br>


  <label for="straat-met-huis-nummer"></label>Straat met huisnummer:</label> <br>
  <input type="straat met huisnummer" placeholder="stationsweg 12" required> <br><br>

  <label for="postcode">Postcode:</label> <br>
  <input type="postcode" placeholder="1234 AB" 
  pattern="[0-9]{4}[A-Z]{2}" required> <br><br>


  <label for="woonplaats">Woonplaats:</label> <br>
  <input type="woonplaats"><br><br>

  <label for="land">Land:</label> <br>
  <input type="land "> <br> <br>

  
  <label for="IBAN-nummer">IBAN-nummer:</label> <br>
  <input type="IBAN-nummer" value="NL"
  pattern="[0-9]{2}[A-Z]{4}[0-9]{10}" required> <br><br>

  <legend>Type abonnement:</legend>
  <div class="container">
  <div>
    <input type="radio" id="Mobiel." name="abonnement" value="Mobiel." checked />
    <label for="Mobiel.">Mobiel.</label>
  </div>
  <div>
    <input type="radio" id="Glasvezel." name="abonnement" value="Glasvezel." />
    <label for="Glasvezel.">Glasvezel.</label>
  </div>
  <div>
    <input type="radio" id="Tv." name="abonnement" value="Tv." />
    <label for="Tv.">Tv.</label>
  </div> 
  </div><br>

  
  <label for="ingangsdatum">Datum van ingang abonnement:</label> <br>
  <input type="date" id="ingangsdatum" name="ingangsdatum" required min="2026-10-16"> <br> <br>

  <label for="looptijd-van-abonnement"> looptijd van abonnement:</label> <br>
  <input type="number" id="looptijd-van-abonnement" min="1" max="12"> <br><br>

 <label for="aantal-gebruikers"> aantal gebruikers:</label> <br>
  <input type="number" id="aantal-gebruikers" min="1" max="4"> <br><br>

  <label for=""></label>

  <label for="email">email:</label> <br> 
  <input type="email" id="email" name="email" placeholder="john@example.com" required><br><br>

  <label for="wachtwoord">wachtwoord:</label> <br>
  <input type="password" id="wachtwoord" name="wachtwoord" required> <br> <br>

  <input type="submit" id="submit" required>


 </form>
  




</body>
</html>
